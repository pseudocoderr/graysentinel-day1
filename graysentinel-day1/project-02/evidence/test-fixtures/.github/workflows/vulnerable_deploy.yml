name: Deploy

on:
  push:
    branches: [main]
  pull_request_target:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@main
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Configure AWS
        run: |
          export AWS_ACCESS_KEY_ID=AKIAABCDEFGHIJKLMNOP
          export AWS_SECRET_ACCESS_KEY="wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY"

      - name: Notify Slack
        run: |
          curl -X POST -H "Content-Type: application/json" -d '{"text":"deployed"}' https://hooks.slack.com/services/xyz
        env:
          api_key: "sk_live_abcdefghijklmnop1234"

      - uses: some-org/some-action@v1
      - uses: another-org/deploy-action@master
