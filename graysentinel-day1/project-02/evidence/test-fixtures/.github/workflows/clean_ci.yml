name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8f4b7f84864484a7bde6ce16d8a30ef7c569f8c3
      - name: Run tests
        run: pytest
        env:
          API_KEY: ${{ secrets.API_KEY }}
